# Use ONLY with: docker compose -p cproviderprices-e2e -f docker-compose.yml -f docker-compose.e2e.yml
# Separate project network/volumes; no development DB, queues, bucket or mail.
services:
  postgres:
    environment:
      POSTGRES_DB: cproviderprices_e2e
    ports: !reset []
  redis:
    ports: !reset []
  minio:
    ports: !reset []
  mailpit:
    ports: !reset []
  api:
    image: cproviderprices-api
    # Laravel's reload mode discards container env overrides in its child server.
    command: sh -c "php artisan app:validate-environment && php artisan serve --host=0.0.0.0 --port=8080 --no-reload"
    environment: &e2e-api
      DB_DATABASE: cproviderprices_e2e
      E2E_ISOLATED: "1"
      APP_ENV: local
      APP_URL: http://localhost:8180
      FRONTEND_URL: http://localhost:3100
      CORS_ALLOWED_ORIGINS: http://localhost:3100
      SESSION_COOKIE: cproviderprices_e2e_session
      INGESTION_SERVICE_TOKEN: ${E2E_INGESTION_TOKEN:?Provide a runtime-only E2E service token}
    ports: !override
      - "127.0.0.1:8180:8080"
  worker:
    image: cproviderprices-worker
    environment: *e2e-api
  ingestion:
    image: cproviderprices-ingestion
    environment:
      INGESTION_SERVICE_TOKEN: ${E2E_INGESTION_TOKEN:?Provide a runtime-only E2E service token}
    ports: !reset []
  web:
    image: cproviderprices-web
    # Keep host-mounted dynamic route discovery deterministic for browser tests.
    command: >-
      sh -c "npm run validate-env --workspace @cproviderprices/web &&
      npm run dev --workspace @cproviderprices/web -- --hostname 0.0.0.0 --webpack"
    # A persisted Next dev cache can retain an outdated dynamic-route manifest.
    # Keep dependency caches, but make compiled E2E output ephemeral per run.
    volumes: !override
      - .:/workspace
      - web-node-modules:/workspace/node_modules
      - web-app-node-modules:/workspace/apps/web/node_modules
    tmpfs:
      - /workspace/apps/web/.next
    # Docker Desktop provides this hostname automatically, but Linux Engine (the
    # GitHub runner) needs an explicit host-gateway mapping for Chromium's
    # localhost-to-host resolver rule in Playwright.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8180
      API_INTERNAL_URL: http://api:8080
      WEB_URL: http://localhost:3100
      E2E_ISOLATED: "1"
      PLAYWRIGHT_DOCKER: "true"
      WEB_HEALTH_URL: http://web:3000/api/health
      API_HEALTH_URL: http://api:8080/api/v1/health
      API_READINESS_URL: http://api:8080/api/v1/readiness
      INGESTION_HEALTH_URL: http://ingestion:8001/health
      MAILPIT_URL: http://mailpit:8025/
    ports: !override
      - "127.0.0.1:3100:3000"
