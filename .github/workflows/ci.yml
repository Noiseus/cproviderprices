name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      ingestion: ${{ steps.filter.outputs.ingestion }}
      contract: ${{ steps.filter.outputs.contract }}
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'apps/web/**'
              - 'packages/domain-types/**'
              - 'package.json'
              - 'package-lock.json'
              - 'eslint.config.mjs'
              - '.prettierignore'
            api:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'apps/api/**'
            ingestion:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'services/ingestion/**'
            contract:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'packages/api-contracts/**'
              - 'packages/generated-api-client/**'
              - 'package.json'
              - 'package-lock.json'
            runtime:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'apps/**'
              - 'services/**'
              - 'packages/**'
              - 'infra/docker/**'
              - 'infra/scripts/**'
              - 'docker-compose.yml'
              - 'package.json'
              - 'package-lock.json'

  web:
    name: Web lint, typecheck, and unit tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  api:
    name: API format, static analysis, and unit tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: curl, mbstring, pdo_pgsql
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate --force
      - run: ./vendor/bin/pint --test
      - run: ./vendor/bin/phpstan analyse --memory-limit=512M
      - run: php artisan test

  ingestion:
    name: Ingestion format, lint, typecheck, and unit tests
    needs: changes
    if: needs.changes.outputs.ingestion == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: services/ingestion/requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: ruff format --check src tests
      - run: ruff check src tests
      - run: mypy src tests
      - run: pytest

  contract:
    name: OpenAPI contract and generated client
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run contract:lint
      - run: npm run check:api-client

  smoke:
    name: Docker Compose smoke test
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sh infra/scripts/setup.sh
      - run: docker compose up -d --wait
      - run: docker compose exec api php artisan migrate --force
      - run: docker compose exec api php artisan db:seed --force
      - run: docker compose exec -e WEB_HEALTH_URL=http://localhost:3000/api/health -e API_HEALTH_URL=http://api:8080/api/v1/health -e API_READINESS_URL=http://api:8080/api/v1/readiness -e INGESTION_HEALTH_URL=http://ingestion:8001/health -e MAILPIT_URL=http://mailpit:8025/ web npm run smoke
      - if: failure()
        run: docker compose logs --tail=200
      - if: always()
        run: docker compose down -v
