name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      ingestion: ${{ steps.filter.outputs.ingestion }}
      contract: ${{ steps.filter.outputs.contract }}
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'apps/web/**'
              - 'packages/domain-types/**'
              - 'package.json'
              - 'package-lock.json'
              - 'eslint.config.mjs'
              - '.prettierignore'
            api:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'apps/api/**'
            ingestion:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'services/ingestion/**'
            contract:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'packages/api-contracts/**'
              - 'packages/generated-api-client/**'
              - 'package.json'
              - 'package-lock.json'
            runtime:
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - 'apps/**'
              - 'services/**'
              - 'packages/**'
              - 'infra/docker/**'
              - 'infra/deployment/**'
              - 'infra/scripts/**'
              - 'docker-compose*.yml'
              - 'package.json'
              - 'package-lock.json'

  web:
    name: Web lint, typecheck, and unit tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  api:
    name: API format, static analysis, and unit tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: cproviderprices_test
          POSTGRES_USER: cproviderprices
          POSTGRES_PASSWORD: test-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cproviderprices -d cproviderprices_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: cproviderprices_test
      DB_USERNAME: cproviderprices
      DB_PASSWORD: test-postgres-password
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: curl, mbstring, pdo_pgsql, zip, xmlreader, simplexml
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate --force
      - run: ./vendor/bin/pint --test
      - run: ./vendor/bin/phpstan analyse --memory-limit=512M
      - run: php artisan test

  ingestion:
    name: Ingestion format, lint, typecheck, and unit tests
    needs: changes
    if: needs.changes.outputs.ingestion == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/ingestion/requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: ruff format --check src tests
      - run: ruff check src tests
      - run: mypy src tests
      - run: pytest

  contract:
    name: OpenAPI contract and generated client
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run contract:lint
      - run: npm run check:api-client

  smoke:
    name: Docker Compose smoke test
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: cproviderprices-e2e
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
      # Chromium runs in `web` and deliberately maps localhost to the Docker
      # host gateway. Expose only this ephemeral CI project's web/API ports to
      # that gateway; local E2E keeps the loopback-only default.
      E2E_HOST_BIND_ADDRESS: 0.0.0.0
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral ingestion credential
        run: |
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "E2E_INGESTION_TOKEN=$token" >> "$GITHUB_ENV"
      - run: sh infra/scripts/setup.sh
      - run: docker compose up -d --wait
      - run: docker compose exec api php artisan migrate --force
      - run: docker compose exec api php artisan db:seed --force
      - run: docker compose exec api php artisan app:prepare-auth-e2e
      - run: docker compose exec web npm run smoke
      - run: docker compose exec api php artisan app:verify-import-e2e
      - if: failure()
        run: docker compose logs --tail=200
      - if: always()
        run: |
          if [ -f .env ] && [ -f apps/web/.env ] && [ -f apps/api/.env ] && [ -f services/ingestion/.env ]; then
            docker compose down -v
          fi
