      properties:
        display_name: { type: string, maxLength: 255 }
        masked_account_reference: { type: [string, "null"], maxLength: 64 }
        source_method: { type: string, enum: [manual_import, future_automatic_sync] }
        expected_refresh_cadence: { type: string, enum: [on_demand, daily, weekly, monthly] }
        status: { type: string, enum: [active, inactive] }
    SubscriptionStatusResponse:
      type: object
      additionalProperties: false
      required: [subscription_status]
      properties:
        subscription_status:
          $ref: "#/components/schemas/SubscriptionStatusDetail"
    SubscriptionStatusDetail:
      type: object
      additionalProperties: false
      required: [plan, subscription, capabilities, limits]
      properties:
        plan:
          oneOf:
            - $ref: "#/components/schemas/PlanSummary"
            - type: "null"
        subscription:
          oneOf:
            - $ref: "#/components/schemas/SubscriptionSummary"
            - type: "null"
        capabilities:
          type: object
          propertyNames:
            $ref: "#/components/schemas/EntitlementKey"
          additionalProperties:
            type: boolean
        limits:
          type: object
          propertyNames:
            $ref: "#/components/schemas/EntitlementKey"
          additionalProperties:
            $ref: "#/components/schemas/EntitlementLimit"
    PlanSummary:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
    SubscriptionSummary:
      type: object
      additionalProperties: false
      required: [status, recorded_status, starts_at, trial_ends_at, current_period_ends_at, access_available]
      properties:
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        recorded_status:
          $ref: "#/components/schemas/SubscriptionStatus"
        starts_at:
          type: string
          format: date-time
        trial_ends_at:
          type: [string, "null"]
          format: date-time
        current_period_ends_at:
          type: [string, "null"]
          format: date-time
        access_available:
          type: boolean
    EntitlementLimit:
      type: object
      additionalProperties: false
      required: [limit, current_usage, reached]
      properties:
        limit:
          type: [integer, "null"]
          minimum: 0
        current_usage:
          type: [integer, "null"]
          minimum: 0
        reached:
          type: [boolean, "null"]
    PlatformSubscriptionActionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [start_trial, extend_trial, activate, mark_past_due, suspend, cancel, restore]
        plan_code:
          type: string
        trial_ends_at:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 3
          maxLength: 1000
          description: Required when suspending or canceling a subscription; retained in safe audit metadata.
    MatchClass:
      type: string
      enum: [exact_match, equivalent_product, comparable_alternative, related_product, not_comparable]
    MatchConfidence:
      type: string
      description: Product-match confidence, distinct from parser extraction confidence.
      enum: [A, B, C, D, E]
    MatchCandidateStatus:
      type: string
      enum: [pending, auto_published, accepted, rejected, superseded]
    PlatformCanonicalProductListResponse:
      type: object
      additionalProperties: false
      required: [canonical_products]
      properties:
        canonical_products:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [id, english_name, variants]
            properties:
              id: { type: string, format: uuid }
              english_name: { type: string }
              variants:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, code]
                  properties:
                    id: { type: string, format: uuid }
                    code: { type: [string, "null"] }
    PlatformMatchCandidateListResponse:
      type: object
      additionalProperties: false
      required: [candidates, pagination, filters, filter_options]
      properties:
        candidates:
          type: array
          items: { $ref: "#/components/schemas/PlatformMatchCandidate" }
        pagination: { $ref: "#/components/schemas/Pagination" }
        filters:
          type: object
          additionalProperties: false
          required: [supplier_account_id, confidence, category_id, age_days, status]
          properties:
            supplier_account_id: { type: [string, "null"], format: uuid }
            confidence:
              oneOf: [{ $ref: "#/components/schemas/MatchConfidence" }, { type: "null" }]
            category_id: { type: [string, "null"], format: uuid }
            age_days: { type: [integer, "null"], minimum: 1 }
            status:
              oneOf: [{ $ref: "#/components/schemas/MatchCandidateStatus" }, { type: "null" }]
        filter_options:
          type: object
          additionalProperties: false
          required: [suppliers, categories]
          properties:
            suppliers:
              type: array
              items: { $ref: "#/components/schemas/PlatformFilterOption" }
            categories:
              type: array
              items: { $ref: "#/components/schemas/PlatformFilterOption" }
    PlatformFilterOption:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    PlatformMatchCandidate:
      type: object
      additionalProperties: false
      required: [id, status, confidence, proposed_match_class, score, rank, generated_at, matcher_version, vendor_item, candidate_product, evidence_summary]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/MatchCandidateStatus" }
        confidence: { $ref: "#/components/schemas/MatchConfidence" }
        proposed_match_class: { $ref: "#/components/schemas/MatchClass" }
        score: { type: integer, minimum: 0 }
        rank: { type: integer, minimum: 1 }
        generated_at: { type: string, format: date-time }
        matcher_version: { type: string }
        vendor_item:
          type: object
          additionalProperties: true
          required: [id, raw_description, supplier]
          properties:
            id: { type: string, format: uuid }
            raw_description: { type: string }
            supplier:
              type: object
              additionalProperties: false
              required: [id, display_name, definition_name]
              properties:
                id: { type: string, format: uuid }
                display_name: { type: string }
                definition_name: { type: string }
        candidate_product:
          type: object
          additionalProperties: true
          required: [id, english_name, category, variant_id]
          properties:
            id: { type: string, format: uuid }
            english_name: { type: string }
            category:
              type: object
              additionalProperties: false
              required: [id, english_name]
              properties:
                id: { type: string, format: uuid }
                english_name: { type: string }
            variant_id: { type: [string, "null"], format: uuid }
        evidence_summary:
          type: object
          additionalProperties: false
          required: [stage, hard_contradictions, attribute_matches]
          properties:
            stage: { type: [string, "null"] }
            hard_contradictions: { type: integer, minimum: 0 }
            attribute_matches: { type: integer, minimum: 0 }
    PlatformMatchCandidateDetailResponse:
      type: object
      additionalProperties: false
      required: [match_candidate]
      properties:
        match_candidate:
          allOf:
            - $ref: "#/components/schemas/PlatformMatchCandidate"
            - type: object
              additionalProperties: true
              required: [evidence, mapping_history, review_history]
              properties:
                evidence: { type: object, additionalProperties: true }
                mapping_history:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, canonical_product_id, canonical_name, match_class, confidence, origin, is_current, verified_at, superseded_at]
                    properties:
                      id: { type: string, format: uuid }
                      canonical_product_id: { type: string, format: uuid }
                      canonical_name: { type: string }
                      match_class: { $ref: "#/components/schemas/MatchClass" }
                      confidence: { $ref: "#/components/schemas/MatchConfidence" }
                      origin: { type: string, enum: [matcher, manual] }
                      is_current: { type: boolean }
                      verified_at: { type: string, format: date-time }
                      superseded_at: { type: [string, "null"], format: date-time }
                review_history:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, action, actor, reason, reviewed_at]
                    properties:
                      id: { type: string, format: uuid }
                      action: { type: string, enum: [accept, reject, choose_existing, create_canonical, reverse] }
                      actor: { type: string, format: email }
                      reason: { type: [string, "null"] }
                      reviewed_at: { type: string, format: date-time }
    ReviewMatchCandidateRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [accept, reject, choose_existing, create_canonical] }
        reason: { type: string, minLength: 3, maxLength: 1000 }
        canonical_product_id: { type: string, format: uuid }
        product_variant_id: { type: string, format: uuid }
        match_class: { $ref: "#/components/schemas/MatchClass" }
        confidence: { $ref: "#/components/schemas/MatchConfidence" }
        new_canonical:
          type: object
          additionalProperties: false
          required: [english_name, category_id]
          properties:
            english_name: { type: string, minLength: 2, maxLength: 255 }
            category_id: { type: string, format: uuid }
            attributes: { type: object, additionalProperties: true }
            aliases:
              type: array
              maxItems: 10
              items:
                type: object
                additionalProperties: false
                required: [locale, alias]
                properties:
                  locale: { type: string, minLength: 2, maxLength: 10 }
                  alias: { type: string, minLength: 1, maxLength: 255 }
            variant:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, minLength: 1, maxLength: 100 }
                normalized_key: { type: string, maxLength: 255 }
                attributes: { type: object, additionalProperties: true }
    PlatformMappingReverseResponse:
      type: object
      additionalProperties: false
      required: [mapping]
      properties:
        mapping:
          type: object
          additionalProperties: false
          required: [id, is_current, superseded_at]
          properties:
            id: { type: string, format: uuid }
            is_current: { type: boolean, const: false }
            superseded_at: { type: [string, "null"], format: date-time }
    PlatformOverviewResponse:
      type: object
      additionalProperties: false
      required: [platform_overview]
      properties:
        platform_overview:
          type: object
          additionalProperties: false
          required: [organization_counts, trialing_subscriptions, pending_invitations, recent_organizations, recent_audit_activity]
          properties:
            organization_counts:
              type: object
              additionalProperties: false
              required: [total, active, suspended, closed]
              properties:
                total: { type: integer, minimum: 0 }
                active: { type: integer, minimum: 0 }
                suspended: { type: integer, minimum: 0 }
                closed: { type: integer, minimum: 0 }
            trialing_subscriptions: { type: integer, minimum: 0 }
            pending_invitations: { type: integer, minimum: 0 }
            recent_organizations:
              type: array
              items:
                $ref: "#/components/schemas/PlatformOrganizationSummary"
            recent_audit_activity:
              type: array
              items:
                $ref: "#/components/schemas/PlatformAuditSummary"
    PlatformOrganizationListResponse:
      type: object
      additionalProperties: false
      required: [organizations, pagination, filters]
      properties:
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/PlatformOrganizationSummary"
        pagination:
          $ref: "#/components/schemas/Pagination"
        filters:
          type: object
          additionalProperties: false
          required: [search, status, subscription_status]
          properties:
            search: { type: [string, "null"] }
            status:
              oneOf:
                - $ref: "#/components/schemas/OrganizationStatus"
                - type: "null"
            subscription_status:
              oneOf:
                - $ref: "#/components/schemas/SubscriptionStatus"
                - type: "null"
    Pagination:
      type: object
      additionalProperties: false
      required: [page, per_page, total, total_pages]
      properties:
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 1 }
    PlatformOrganizationSummaryResponse:
      type: object
      additionalProperties: false
      required: [organization]
      properties:
        organization:
          $ref: "#/components/schemas/PlatformOrganizationSummary"
    PlatformOrganizationSummary:
      type: object
      additionalProperties: false
      required: [id, name, slug, status, created_at, subscription]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status:
          $ref: "#/components/schemas/OrganizationStatus"
        created_at: { type: string, format: date-time }
        subscription:
          oneOf:
            - $ref: "#/components/schemas/PlatformSubscriptionSummary"
            - type: "null"
    PlatformSubscriptionSummary:
      type: object
      additionalProperties: false
      required: [status, plan_code, trial_ends_at]
      properties:
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        plan_code: { type: string }
        trial_ends_at: { type: [string, "null"], format: date-time }
    CreatePlatformOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: { type: string, maxLength: 255 }
        slug:
          type: string
          minLength: 2
          maxLength: 120
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    PlatformOrganizationStatusRequest:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          $ref: "#/components/schemas/OrganizationStatus"
        reason: { type: string, minLength: 3, maxLength: 1000 }
    PlatformOrganizationStatusResponse:
      type: object
      additionalProperties: false
      required: [organization_status]
      properties:
        organization_status:
          type: object
          additionalProperties: false
          required: [id, status]
          properties:
            id: { type: string, format: uuid }
            status:
              $ref: "#/components/schemas/OrganizationStatus"
    PlatformOrganizationDetailResponse:
      type: object
      additionalProperties: false
      required: [platform_organization]
      properties:
        platform_organization:
          type: object
          additionalProperties: false
          required: [organization, locations, members, invitations, subscription_status, available_plans, audit_activity]
          properties:
            organization:
              $ref: "#/components/schemas/PlatformOrganizationSummary"
            locations:
              type: array
              items:
                $ref: "#/components/schemas/PlatformLocationSummary"
            members:
              type: array
              items:
                $ref: "#/components/schemas/PlatformMemberSummary"
            invitations:
              type: array
              items:
                $ref: "#/components/schemas/PlatformInvitation"
            subscription_status:
              $ref: "#/components/schemas/SubscriptionStatusDetail"
            available_plans:
              type: array
              items:
                $ref: "#/components/schemas/PlanSummary"
            audit_activity:
              type: array
              items:
                $ref: "#/components/schemas/PlatformAuditSummary"
    PlatformLocationSummary:
      type: object
      additionalProperties: false
      required: [id, name, code, status, timezone]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        status: { type: string, enum: [active, inactive] }
        timezone: { type: string }
    PlatformMemberSummary:
      type: object
      additionalProperties: false
      required: [id, name, email, role, status, joined_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role:
          $ref: "#/components/schemas/OrganizationRole"
        status:
          $ref: "#/components/schemas/MembershipStatus"
        joined_at: { type: [string, "null"], format: date-time }
    PlatformInvitationResponse:
      type: object
      additionalProperties: false
      required: [invitation]
      properties:
        invitation:
          $ref: "#/components/schemas/PlatformInvitation"
    PlatformInvitation:
      type: object
      additionalProperties: false
      required: [id, intended_email, intended_role, status, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        intended_email: { type: string, format: email }
        intended_role:
          type: string
          const: organization_owner
        status: { type: string, enum: [pending, accepted, expired, revoked] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    CreateInitialOwnerInvitationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 255 }
    PlatformAuditSummary:
      type: object
      additionalProperties: false
      required: [id, action, actor_label, subject_type, subject_id, metadata, occurred_at]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        actor_label: { type: [string, "null"] }
        subject_type: { type: [string, "null"] }
        subject_id: { type: [string, "null"] }
        metadata:
          type: object
          additionalProperties: true
        occurred_at: { type: string, format: date-time }
