      properties:
        value: { type: string, description: Decimal display denominator. }
        unit: { type: string, enum: [lb, gal, ea] }
        canonical_value: { type: string, description: Decimal source-normalized denominator. }
        canonical_unit: { type: string, enum: [g, mL, ea] }
    CalculationTrace:
      type: object
