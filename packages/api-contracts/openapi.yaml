      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/SupplierAccountId"
    patch:
      operationId: updateSupplierAccount
      summary: Update safe supplier-account metadata
      security: [{ cookieSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateSupplierAccountRequest" } } }
      responses:
        "200":
          description: Supplier account updated.
          content: { application/json: { schema: { $ref: "#/components/schemas/SupplierAccountResponse" } } }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /organizations/{organization}/product-search:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/RequestId"
      - name: q
        in: query
        required: true
        description: Bounded search text. The server deterministically parses supported size and unit tokens; it does not use AI query interpretation.
        schema: { type: string, minLength: 1, maxLength: 160 }
      - name: location_id
        in: query
        required: true
        description: Requested location is verified against the server-authorized organization membership.
        schema: { type: string, format: uuid }
      - name: category_id
        in: query
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/SupplierFilter"
      - $ref: "#/components/parameters/BrandFilter"
      - $ref: "#/components/parameters/UnitFilter"
      - $ref: "#/components/parameters/AvailabilityFilter"
      - $ref: "#/components/parameters/FreshnessFilter"
      - $ref: "#/components/parameters/ComparisonClassFilter"
      - name: sort
        in: query
        schema: { type: string, enum: [relevance, lowest_case_price, lowest_normalized_price, newest_observation], default: relevance }
      - $ref: "#/components/parameters/SearchPage"
      - $ref: "#/components/parameters/SearchPerPage"
    get:
      operationId: searchProducts
      summary: Search global canonical catalog with tenant/location-private offer summaries
      description: >-
        Canonical catalog rows may appear with zero offers. Supplier, price, freshness, and match summaries only include eligible tenant/location-private offers. Results are bounded, server-filtered, and use a short scoped private cache.
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: Grouped canonical product results with safe private summaries.
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/ProductSearchResponse" } } }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /organizations/{organization}/comparisons/{canonicalProduct}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/CanonicalProductId"
      - $ref: "#/components/parameters/RequestId"
      - name: location_id
        in: query
        required: true
        description: Requested location is verified against the server-authorized organization membership.
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/SupplierFilter"
      - $ref: "#/components/parameters/AvailabilityFilter"
      - $ref: "#/components/parameters/FreshnessFilter"
      - $ref: "#/components/parameters/ComparisonClassFilter"
      - name: sort
        in: query
        schema: { type: string, enum: [supplier, lowest_case_price, lowest_normalized_price, newest_observation], default: supplier }
      - $ref: "#/components/parameters/SearchPage"
      - $ref: "#/components/parameters/ComparisonPerPage"
    get:
      operationId: getProductComparison
      summary: Compare eligible tenant/location-private offers for one canonical product
      description: >-
        Case and normalized price winners are calculated server-side using decimal arithmetic. Alternatives and unsafe comparisons remain visible with explicit warnings and cannot receive direct-comparison winner labels.
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: First-view offer comparison with calculation traceability; full history is intentionally excluded.
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/ProductComparisonResponse" } } }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /organizations/{organization}/price-history/{canonicalProduct}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/CanonicalProductId"
      - $ref: "#/components/parameters/RequestId"
      - name: location_id
        in: query
        required: true
        description: Requested location is verified against the server-authorized organization membership.
        schema: { type: string, format: uuid }
      - name: from
        in: query
        description: Inclusive UTC calendar-date start. The range is bounded to 366 days.
        schema: { type: string, format: date }
      - name: to
        in: query
        description: Inclusive UTC calendar-date end. The range is bounded to 366 days.
        schema: { type: string, format: date }
      - $ref: "#/components/parameters/SupplierFilter"
      - name: dimension
        in: query
        description: Restricts daily aggregation to a compatible unit dimension.
        schema: { type: string, enum: [weight, volume, count] }
    get:
      operationId: getPriceHistory
      summary: Read tenant/location-authorized immutable price history for one canonical product
      description: >-
        Observations retain source and import timestamps. Daily means are calculated with exact decimal arithmetic only within the same supplier, currency, and compatible unit dimension. Unsafe or incompatible observations remain visible but are not fabricated into a normalized series.
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: Bounded price history, safe aggregation, and traceable observation metadata.
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/PriceHistoryResponse" } } }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /organizations/{organization}/saved-lists:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/RequestId"
