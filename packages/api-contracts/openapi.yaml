openapi: 3.1.0
info:
  title: CProviderPrices API
  version: 0.11.0
  description: Versioned API contract for operational, invite-only authentication, tenant-context, entitlement, and explicit platform-administration endpoints.
security: []
servers:
  - url: /api/v1
    description: Versioned API base path
paths:
  /organizations/{organization}/imports:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/RequestId"
      - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    get:
      operationId: listImports
      summary: List authorized historical imports
      description: >-
        Active members may read history even when manual imports are disabled. Organization identifiers in body/query are prohibited. Pagination follows the shared contract.
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: List authorized historical imports.
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/ImportListResponse" } } }
        default: { $ref: "#/components/responses/ErrorResponse" }
    post:
      operationId: createImport
      summary: Upload a private CSV or XLSX import
      description: >-
        Owners and buyers only. Requires manual_imports_enabled and subscription access after tenant authorization. Server checks location/account ancestry. 10 MiB hard maximum, configurable lower ceiling. CSV is UTF-8, single physical line per record, comma/semicolon/tab delimited. XLSX supports one sheet with no formulas or external references. Preview reads at most 20 data rows under ZIP/XML/row/cell bounds; late structural defects are detected asynchronously. SHA-256 duplicate identity is organization + supplier account (which fixes location), independent of filename. No permanent storage URLs or object keys are returned.
      security: [{ cookieSession: [] }]
      requestBody:
        required: true
        content: { multipart/form-data: { schema: { $ref: "#/components/schemas/ImportUploadRequest" } } }
      responses:
        "201":
          description: Upload a private CSV or XLSX import.
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/ImportDetailResponse" } } }
        "403": { $ref: "#/components/responses/ManualImportDisabled" }
        "409": { $ref: "#/components/responses/DuplicateImport" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /organizations/{organization}/imports/{import}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/ImportId"
    get:
      operationId: getImport
      summary: Get import status and bounded preview
      description: >-
        Includes at most 20 sample rows and 100 safe errors. Full errors are available through authorized download. Mapping validation remains needs_mapping until Start; timestamps distinguish validation progress. Queued awaits bounded Python delivery. Processing counters are updated at batch boundaries, not dispatch time.
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: Get import status and bounded preview.
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/ImportDetailResponse" } } }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /organizations/{organization}/imports/{import}/mapping:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/ImportId"
    put:
      operationId: confirmImportMapping
      summary: Create update or select the mapping snapshot
      description: >-
        Requires needs_mapping with validation not yet started. Template selection requires identical ordered headers and the same organization/account. Saving the same template_name updates the reusable template but never changes existing run snapshots. Mapping only copies strings; no normalization.
      security: [{ cookieSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ImportMappingRequest" } } }
      responses:
        "200":
          description: Create update or select the mapping snapshot.
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/ImportDetailResponse" } } }
        "403": { $ref: "#/components/responses/ManualImportDisabled" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /organizations/{organization}/imports/{import}/validate:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/ImportId"
    post:
      operationId: validateImport
      summary: Queue bounded mapped-row validation
      description: >-
        Requires a confirmed mapping. Idempotent replay resumes incomplete validation or returns finished validation. Each Redis job writes at most 100 rows; invalid rows get stable errors while valid raw records remain eligible. Mapping becomes immutable.
      security: [{ cookieSession: [] }]
      responses:
        "202":
          description: Queue bounded mapped-row validation.
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/ImportDetailResponse" } } }
        "403": { $ref: "#/components/responses/ManualImportDisabled" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /organizations/{organization}/imports/{import}/start:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/ImportId"
    post:
      operationId: startImport
      summary: Queue validated records for normalization
      description: >-
        Requires finished validation and at least one valid raw record. Returns 409 import_not_ready or invalid_import_transition otherwise. Queued or processing retries safely redispatch the bounded tenant/run pointer to import-normalization. Previously completed rows are skipped; terminal imports cannot restart. The same owner/buyer and entitlement checks apply to resume.
      security: [{ cookieSession: [] }]
      responses:
        "202":
          description: Queue validated records for normalization.
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/ImportDetailResponse" } } }
        "403": { $ref: "#/components/responses/ManualImportDisabled" }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /organizations/{organization}/imports/{import}/cancel:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/ImportId"
    post:
      operationId: cancelImport
      summary: Cancel an import without deleting its evidence
      description: >-
        Owners and buyers may cancel even if the feature was disabled. Canceled replay is idempotent; other terminal states reject cancellation. Pending jobs recheck locked lifecycle state before writing.
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: Cancel an import without deleting its evidence.
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/ImportDetailResponse" } } }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /organizations/{organization}/imports/{import}/downloads:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/ImportId"
    post:
      operationId: authorizeImportDownloads
      summary: Issue five-minute private download links
      description: >-
        Any current authorized member may obtain relative signed application URLs. Redemption requires a current session, active tenant membership, complete ancestry and an unexpired signature. Links are not object-store URLs.
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: Issue five-minute private download links.
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/ImportDownloadsResponse" } } }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /organizations/{organization}/import-mapping-templates:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/RequestId"
      - { name: supplier_account_id, in: query, required: true, schema: { type: string, format: uuid } }
      - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    get:
      operationId: listImportMappingTemplates
      summary: List account-scoped mapping templates
      description: >-
        Twenty templates per page, ordered by name. Account ancestry is checked before querying; filename alone never selects a template.
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: List account-scoped mapping templates.
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestId" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/ImportTemplateListResponse" } } }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /organizations/{organization}/imports/{import}/files/{file}/download:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/ImportId"
      - { name: file, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: expires, in: query, required: true, schema: { type: integer } }
      - { name: signature, in: query, required: true, schema: { type: string } }
    get:
      operationId: downloadImportFile
      summary: Stream an authorized private source file
      description: Requires current session/tenant authorization and a five-minute relative signature issued by authorizeImportDownloads. Response is an attachment with private no-store caching and nosniff. Error CSV neutralizes spreadsheet formulas and does not echo raw values. Invalid or expired signatures return 403; wrong ancestry returns 404.
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: Private attachment.
          headers:
            Cache-Control: { schema: { type: string, const: "private, no-store" } }
            Content-Disposition: { schema: { type: string } }
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /organizations/{organization}/imports/{import}/errors/download:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/ImportId"
      - { name: expires, in: query, required: true, schema: { type: integer } }
      - { name: signature, in: query, required: true, schema: { type: string } }
    get:
      operationId: downloadImportErrors
      summary: Stream an authorized private error report
      description: Requires current session/tenant authorization and a five-minute relative signature issued by authorizeImportDownloads. Response is an attachment with private no-store caching and nosniff. Error CSV neutralizes spreadsheet formulas and does not echo raw values. Invalid or expired signatures return 403; wrong ancestry returns 404.
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: Private attachment.
          headers:
            Cache-Control: { schema: { type: string, const: "private, no-store" } }
            Content-Disposition: { schema: { type: string } }
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content: { text/csv: { schema: { type: string, format: binary } } }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /health:
    get:
      operationId: getHealth
      summary: Report API liveness
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: API process is running.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /readiness:
    get:
      operationId: getReadiness
      summary: Verify API dependencies
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Required dependencies are available.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: At least one required dependency is unavailable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /auth/csrf-cookie:
    get:
      operationId: initializeCsrfCookie
      summary: Initialize the browser session and readable CSRF cookie
      responses:
        "200":
          description: CSRF state initialized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /auth/login:
    post:
      operationId: login
      summary: Start an invite-only browser session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /auth/session:
    get:
      operationId: getCurrentSession
      summary: Get the authenticated user and authorized organizations
      security:
        - cookieSession: []
      responses:
        "200":
          description: Current authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: logout
      summary: Invalidate the current browser session
      security:
        - cookieSession: []
      responses:
        "200":
          description: Session invalidated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /auth/preferences:
    patch:
      operationId: updateAuthenticatedPreferences
      summary: Update the authenticated user's presentation preferences
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesRequest"
      responses:
        "200":
          description: Preferences updated without changing the authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      summary: Request reset instructions without disclosing account existence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: Generic reset-request acknowledgement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Reset a password using a valid reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /auth/invitations/{token}:
    parameters:
      - $ref: "#/components/parameters/InvitationToken"
    get:
      operationId: getInvitation
      summary: Inspect an invitation's authoritative public acceptance context
      responses:
        "200":
          description: Active invitation context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /auth/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Atomically activate an invited account and membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: Invitation accepted and browser session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /auth/email/verification-notification:
    post:
      operationId: sendEmailVerification
      summary: Send a verification link when the authenticated email is unverified
      security:
        - cookieSession: []
      responses:
        "200":
          description: Generic verification notification acknowledgement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /auth/verify-email/{id}/{hash}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: hash
        in: path
        required: true
        schema:
          type: string
      - name: expires
        in: query
        required: true
        schema:
          type: integer
      - name: signature
        in: query
        required: true
        schema:
          type: string
    get:
      operationId: verifyEmail
      summary: Verify the authenticated user's email with a signed link
      security:
        - cookieSession: []
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /organizations/{organization}/context:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: getOrganizationContext
      summary: Resolve the active authenticated tenant context
      security:
        - cookieSession: []
      responses:
        "200":
          description: Server-authorized active tenant context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationContextResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /organizations/{organization}/status:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: getOrganizationStatus
      summary: Read limited lifecycle status for an authorized organization
      security:
        - cookieSession: []
      responses:
        "200":
          description: Limited organization lifecycle status, including suspended tenants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationStatusResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /organizations/{organization}/subscription:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: getOrganizationSubscriptionStatus
      summary: Read the effective plan, subscription lifecycle, capabilities, limits, and usage
      security:
        - cookieSession: []
      responses:
        "200":
          description: Provider-neutral subscription and entitlement status for the authorized tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatusResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /organizations/{organization}/switch:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    post:
      operationId: switchOrganization
      summary: Select another active organization membership
      security:
        - cookieSession: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                intended_destination:
                  type: string
      responses:
        "200":
          description: Organization context selected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /organizations/{organization}/restaurant-locations/{restaurantLocation}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/RestaurantLocationId"
    get:
      operationId: getRestaurantLocation
      summary: Get a restaurant location through its authoritative organization
      security:
        - cookieSession: []
      responses:
        "200":
          description: Tenant-scoped restaurant location.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantLocationResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    patch:
      operationId: updateRestaurantLocation
      summary: Update an owner-authorized restaurant location
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRestaurantLocationRequest"
      responses:
        "200":
          description: Restaurant location updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantLocationResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteRestaurantLocation
      summary: Delete an owner-authorized restaurant location
      security:
        - cookieSession: []
      responses:
        "200":
          description: Restaurant location deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /organizations/{organization}/restaurant-locations:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: listRestaurantLocations
      summary: List retained tenant locations
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: Tenant-scoped locations.
          content: { application/json: { schema: { $ref: "#/components/schemas/RestaurantLocationListResponse" } } }
        default: { $ref: "#/components/responses/ErrorResponse" }
    post:
      operationId: createRestaurantLocation
      summary: Create a tenant location when role authorization and the plan limit allow it
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRestaurantLocationRequest"
      responses:
        "201":
          description: Restaurant location created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantLocationResponse"
        "403":
          $ref: "#/components/responses/FeatureDisabled"
        "409":
          $ref: "#/components/responses/LimitReached"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /organizations/{organization}/restaurant-locations/{restaurantLocation}/select:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/RestaurantLocationId"
    post:
      operationId: selectRestaurantLocation
      summary: Select an active location in the authenticated session
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: Location selected.
          content: { application/json: { schema: { $ref: "#/components/schemas/SelectedLocationResponse" } } }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /organizations/{organization}/team:
    parameters: [{ $ref: "#/components/parameters/OrganizationId" }]
    get:
      operationId: listOrganizationTeam
      summary: List active members and pending invitations
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: Tenant team configuration.
          content: { application/json: { schema: { $ref: "#/components/schemas/TeamResponse" } } }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /organizations/{organization}/invitations:
    parameters: [{ $ref: "#/components/parameters/OrganizationId" }]
    post:
      operationId: createTeamInvitation
      summary: Invite a tenant member; owner role requires explicit confirmation
      security: [{ cookieSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateTeamInvitationRequest" } } }
      responses:
        "201":
          description: Invitation created.
          content: { application/json: { schema: { $ref: "#/components/schemas/TeamInvitationResponse" } } }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /organizations/{organization}/invitations/{invitation}/resend:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/InvitationId"
    post:
      operationId: resendTeamInvitation
      summary: Revoke and safely replace a pending invitation
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: Replacement invitation created.
          content: { application/json: { schema: { $ref: "#/components/schemas/TeamInvitationResponse" } } }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /organizations/{organization}/invitations/{invitation}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
      - $ref: "#/components/parameters/InvitationId"
    delete:
      operationId: revokeTeamInvitation
      summary: Revoke a pending invitation
      security: [{ cookieSession: [] }]
      responses:
        "200": { description: Invitation revoked., content: { application/json: { schema: { $ref: "#/components/schemas/MessageResponse" } } } }
        default: { $ref: "#/components/responses/ErrorResponse" }
  /organizations/{organization}/supplier-accounts:
    parameters: [{ $ref: "#/components/parameters/OrganizationId" }]
    get:
      operationId: listSupplierAccounts
      summary: List safe supplier-account metadata and global supplier definitions
      security: [{ cookieSession: [] }]
      parameters:
        - name: location_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Supplier metadata.
          content: { application/json: { schema: { $ref: "#/components/schemas/SupplierAccountListResponse" } } }
        default: { $ref: "#/components/responses/ErrorResponse" }
    post:
      operationId: createSupplierAccount
      summary: Create safe tenant/location-scoped supplier-account metadata
      security: [{ cookieSession: [] }]
      requestBody:
        required: true
