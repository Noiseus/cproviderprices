          properties:
            supplier_account_id: { type: [string, "null"], format: uuid }
            confidence:
              oneOf: [{ $ref: "#/components/schemas/MatchConfidence" }, { type: "null" }]
            category_id: { type: [string, "null"], format: uuid }
            age_days: { type: [integer, "null"], minimum: 1 }
            status:
              oneOf: [{ $ref: "#/components/schemas/MatchCandidateStatus" }, { type: "null" }]
        filter_options:
          type: object
          additionalProperties: false
          required: [suppliers, categories]
          properties:
            suppliers:
              type: array
              items: { $ref: "#/components/schemas/PlatformFilterOption" }
            categories:
