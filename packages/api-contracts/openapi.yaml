        - required: [quantity_target]
        - required: [preferred_unit]
        - required: [notes]
      properties:
        quantity_target: { type: string, pattern: "^\\d{1,12}(?:\\.\\d{1,6})?$" }
        preferred_unit: { type: [string, "null"], enum: [lb, gal, ea, null] }
        notes: { type: [string, "null"], maxLength: 2000 }
        expected_version: { type: integer, minimum: 1 }
    SelectSavedListOfferRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        selected_offer_id: { type: [string, "null"], format: uuid }
        expected_version: { type: integer, minimum: 1 }
    SavedListItemMutationResponse:
      type: object
      additionalProperties: false
      required: [saved_list, item]
      properties:
        saved_list: { $ref: "#/components/schemas/SavedListVersion" }
        item: { $ref: "#/components/schemas/SavedListItem" }
    RemoveSavedListItemResponse:
      type: object
      additionalProperties: false
      required: [saved_list, removed_item_id]
      properties:
        saved_list: { $ref: "#/components/schemas/SavedListVersion" }
        removed_item_id: { type: string, format: uuid }
    ReorderSavedListRequest:
      type: object
      additionalProperties: false
      required: [item_ids, expected_list_version]
      properties:
        item_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        expected_list_version: { type: integer, minimum: 1 }
    ReorderedSavedListItem:
      type: object
      additionalProperties: false
      required: [id, sort_order, version]
      properties:
        id: { type: string, format: uuid }
        sort_order: { type: integer, minimum: 1 }
        version: { type: integer, minimum: 1 }
    ReorderSavedListResponse:
      type: object
      additionalProperties: false
      required: [saved_list, items]
      properties:
        saved_list: { $ref: "#/components/schemas/SavedListVersion" }
        items: { type: array, items: { $ref: "#/components/schemas/ReorderedSavedListItem" } }
    ImportStatus:
      type: string
      enum: [uploaded, validating, needs_mapping, queued, processing, partially_completed, completed, failed, canceled]
      description: Phase B ends at queued. Failed/canceled are terminal; later phases own normalization and successful terminal states.
    ImportUploadRequest:
      type: object
      additionalProperties: false
      required: [restaurant_location_id, supplier_account_id, file]
      properties:
        restaurant_location_id: { type: string, format: uuid }
        supplier_account_id: { type: string, format: uuid }
        file: { type: string, format: binary, description: "Nonempty CSV/XLSX, at most 10485760 bytes (or configured lower limit)." }
    ImportMappingFields:
      type: object
      additionalProperties: false
      required: [supplier_sku, description]
      description: Values name exact detected source headers; each column may be selected only once. All source values remain strings.
      properties:
        supplier_sku: { type: string, minLength: 1, maxLength: 4096 }
        description: { type: string, minLength: 1, maxLength: 4096 }
        brand: { type: string, minLength: 1, maxLength: 4096 }
        pack_size_text: { type: string, minLength: 1, maxLength: 4096 }
        quantity: { type: string, minLength: 1, maxLength: 4096 }
        weight: { type: string, minLength: 1, maxLength: 4096 }
        volume: { type: string, minLength: 1, maxLength: 4096 }
        unit: { type: string, minLength: 1, maxLength: 4096 }
        price: { type: string, minLength: 1, maxLength: 4096 }
        currency: { type: string, minLength: 1, maxLength: 4096 }
        source_updated_at: { type: string, minLength: 1, maxLength: 4096, description: "Optional source-updated ISO-8601 timestamp. It is preserved separately and never fabricated." }
        observed_at: { type: string, minLength: 1, maxLength: 4096, description: "Source-observed ISO-8601 timestamp; no price observation is fabricated if it is absent." }
        availability: { type: string, minLength: 1, maxLength: 4096, description: "Source availability/status; unrecognized values remain unknown." }
        gtin: { type: string, minLength: 1, maxLength: 4096 }
    ImportSourceConventions:
      type: object
      additionalProperties: false
      properties:
        volume_system: { type: string, enum: [us_liquid] }
        produce_size_code: { type: boolean }
        pound_sign_is_weight: { type: boolean }
    ImportMappingRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mapping]
          properties:
            mapping: { $ref: "#/components/schemas/ImportMappingFields" }
            source_conventions: { $ref: "#/components/schemas/ImportSourceConventions" }
            template_name: { type: string, minLength: 1, maxLength: 100 }
        - type: object
          additionalProperties: false
          required: [template_id]
          properties:
            template_id: { type: string, format: uuid }
    ImportMappingSnapshot:
      type: object
      additionalProperties: false
      required: [version, headers, mapping, source_conventions]
      properties:
        version: { type: integer, const: 1 }
        headers: { type: array, minItems: 1, maxItems: 100, items: { type: string } }
        mapping: { $ref: "#/components/schemas/ImportMappingFields" }
        source_conventions: { $ref: "#/components/schemas/ImportSourceConventions" }
    ImportSummary:
      type: object
      additionalProperties: false
      required: [id, restaurant_location_id, supplier_account_id, status, mapping_snapshot, mapping_template_id, validation_started_at, validation_completed_at, validated_through_row, valid_rows, processed_count, warning_count, failed_count, normalization_failed_count, remaining_count, retry_count, created_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        restaurant_location_id: { type: string, format: uuid }
        supplier_account_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ImportStatus" }
        mapping_snapshot:
          oneOf:
            - { $ref: "#/components/schemas/ImportMappingSnapshot" }
            - { type: "null" }
        mapping_template_id: { type: [string, "null"], format: uuid }
        validation_started_at: { type: [string, "null"], format: date-time }
        validation_completed_at: { type: [string, "null"], format: date-time }
        validated_through_row: { type: integer, minimum: 1 }
        valid_rows: { type: integer, minimum: 0 }
        processed_count: { type: integer, minimum: 0, description: "Persisted successful rows for parser version 1.0.0, including warning-bearing rows." }
        warning_count: { type: integer, minimum: 0 }
        failed_count: { type: integer, minimum: 0, description: "Distinct failed source rows across validation and normalization, not error objects." }
        normalization_failed_count: { type: integer, minimum: 0, description: "Eligible raw rows permanently failed during normalization." }
        remaining_count: { type: integer, minimum: 0, description: "Eligible rows minus persisted success and normalization failure counts; retained after cancellation." }
        retry_count: { type: integer, minimum: 0, description: "Transient service attempts eligible for queue retry; excludes final exhausted attempt." }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    ImportPreviewFile:
      type: object
      additionalProperties: false
      required: [id, original_filename, size_bytes, format, headers, sample_rows]
      properties:
        id: { type: string, format: uuid }
        original_filename: { type: string, maxLength: 200 }
        size_bytes: { type: integer, minimum: 1, maximum: 10485760 }
        format: { type: string, enum: [csv, xlsx] }
        headers: { type: array, minItems: 1, maxItems: 100, items: { type: string } }
        sample_rows:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [source_row, values]
            properties:
              source_row: { type: integer, minimum: 2 }
              values: { type: array, maxItems: 100, items: { type: string, maxLength: 4096 } }
    ImportRowError:
      type: object
      additionalProperties: false
      required: [source_row, field, code, message]
      properties:
        source_row: { type: [integer, "null"], minimum: 1 }
        field: { type: [string, "null"] }
        code: { type: string, enum: [missing_supplier_sku, missing_description, column_count_mismatch, invalid_import_file, validation_unavailable] }
        message: { type: string, description: "Safe explanation; never source contents or a stack trace." }
    ImportDetailResponse:
      type: object
      additionalProperties: false
      required: [import, file, errors]
      properties:
        import: { $ref: "#/components/schemas/ImportSummary" }
        file: { $ref: "#/components/schemas/ImportPreviewFile" }
        errors: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/ImportRowError" } }
    ImportListResponse:
      type: object
      additionalProperties: false
      required: [imports, pagination]
      properties:
        imports: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/ImportSummary" } }
        pagination: { $ref: "#/components/schemas/Pagination" }
    ImportTemplateListResponse:
      type: object
      additionalProperties: false
      required: [templates, pagination]
      properties:
        pagination: { $ref: "#/components/schemas/Pagination" }
        templates:
          type: array
