        raw_supplier_name: { type: string }
        pack: { type: object, additionalProperties: true }
        case_price: { type: string, description: Decimal source case price. }
        currency: { type: string, minLength: 3, maxLength: 3 }
        normalized_price: { type: [string, "null"] }
        normalized_unit: { type: [string, "null"], enum: [lb, gal, ea, null] }
