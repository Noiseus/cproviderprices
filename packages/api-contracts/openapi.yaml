      properties:
        platform_organization:
          type: object
          additionalProperties: false
          required: [organization, locations, members, invitations, subscription_status, available_plans, audit_activity]
          properties:
            organization:
              $ref: "#/components/schemas/PlatformOrganizationSummary"
            locations:
              type: array
              items:
                $ref: "#/components/schemas/PlatformLocationSummary"
            members:
              type: array
              items:
                $ref: "#/components/schemas/PlatformMemberSummary"
            invitations:
              type: array
              items:
                $ref: "#/components/schemas/PlatformInvitation"
            subscription_status:
              $ref: "#/components/schemas/SubscriptionStatusDetail"
            available_plans:
              type: array
              items:
                $ref: "#/components/schemas/PlanSummary"
            audit_activity:
              type: array
              items:
                $ref: "#/components/schemas/PlatformAuditSummary"
    PlatformLocationSummary:
      type: object
      additionalProperties: false
      required: [id, name, code, status, timezone]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        status: { type: string, enum: [active, inactive] }
        timezone: { type: string }
    PlatformMemberSummary:
      type: object
      additionalProperties: false
      required: [id, name, email, role, status, joined_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role:
          $ref: "#/components/schemas/OrganizationRole"
        status:
          $ref: "#/components/schemas/MembershipStatus"
        joined_at: { type: [string, "null"], format: date-time }
    PlatformInvitationResponse:
      type: object
      additionalProperties: false
      required: [invitation]
      properties:
        invitation:
          $ref: "#/components/schemas/PlatformInvitation"
    PlatformInvitation:
      type: object
      additionalProperties: false
      required: [id, intended_email, intended_role, status, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        intended_email: { type: string, format: email }
        intended_role:
          type: string
          const: organization_owner
        status: { type: string, enum: [pending, accepted, expired, revoked] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    CreateInitialOwnerInvitationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 255 }
    PlatformAuditSummary:
      type: object
      additionalProperties: false
      required: [id, action, actor_label, subject_type, subject_id, metadata, occurred_at]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        actor_label: { type: [string, "null"] }
        subject_type: { type: [string, "null"] }
        subject_id: { type: [string, "null"] }
        metadata:
          type: object
          additionalProperties: true
        occurred_at: { type: string, format: date-time }
