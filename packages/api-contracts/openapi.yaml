        freshness: { $ref: "#/components/schemas/PriceFreshness" }
        comparison_class: { $ref: "#/components/schemas/ComparisonClass" }
        warnings: { type: array, items: { type: string } }
        winner_labels: { type: array, items: { $ref: "#/components/schemas/WinnerLabel" } }
