        offer_count: { type: integer, minimum: 0 }
        suppliers:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/SupplierSearchSummary" }
        supplier_count: { type: integer, minimum: 0 }
        match_quality_summary: { $ref: "#/components/schemas/ComparisonClassSummary" }
        freshness_summary: { $ref: "#/components/schemas/FreshnessSummary" }
        price_summary: { $ref: "#/components/schemas/SearchPriceSummary" }
        relevance_score: { type: integer, minimum: 0 }
    PartialSupplierState:
      type: object
      additionalProperties: false
      required: [supplier_accounts]
      properties:
        supplier_accounts:
          type: array
